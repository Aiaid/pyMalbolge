name: Native wheel artifacts

on:
  pull_request:
    paths:
      - 'malbolge/**'
      - 'scripts/native_build.py'
      - 'scripts/hatch_native.py'
      - 'scripts/build_native_vm.py'
      - 'scripts/verify_native_install.py'
      - 'scripts/verify_release_install.py'
      - 'scripts/verify_release_artifacts.py'
      - 'scripts/verify_release_bundle.py'
      - 'test/test_release_artifacts.py'
      - 'test/test_release_bundle.py'
      - 'test/test_native_packaging.py'
      - 'pyproject.toml'
      - '.github/workflows/native-wheels.yml'
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      testpypi:
        description: Stamp a uniform temporary TestPyPI version in every build job
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.aggregate.outputs.version }}
      artifact_name:
        value: ${{ jobs.aggregate.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      macos_arm64_only:
        description: Retry only the macOS ARM64 wheel group
        type: boolean
        default: false
      macos_arm64_runner:
        description: Supported Apple Silicon runner image
        type: choice
        default: macos-15
        options: [macos-15, macos-26]

# Build and retain reviewable artifacts; this workflow never publishes to PyPI.
permissions:
  contents: read

concurrency:
  group: native-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # Five native runners: no QEMU or untested cross-compiled artifacts.
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            jit: --expect-no-jit
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            jit: --require-jit
          - runner: ${{ inputs.macos_arm64_runner || 'macos-15' }}
            platform: macos
            arch: arm64
            # Hosted macOS can lack thread-local JIT write protection. The
            # helper checks the OS probe and explicit unavailable rejection;
            # if available, real machine-code execution is still mandatory.
            jit: ''
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            jit: --expect-no-jit
          - runner: windows-2022
            platform: windows
            arch: AMD64
            jit: --expect-no-jit
    steps:
      # Versions verified against the official Actions release pages.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: '3.12'
      - name: Prepare persistent smoke reports
        run: mkdir -p wheel-provenance
      - name: Stamp temporary TestPyPI version consistently across jobs
        if: inputs.testpypi
        run: uv run --no-project --python 3.12 python scripts/prepare_testpypi_version.py
      - name: Read the candidate version from source metadata
        id: release
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf8'))['project']['version']
          if not isinstance(version, str) or not re.fullmatch(r'[0-9][A-Za-z0-9.!+_-]*', version):
              raise SystemExit('Invalid source release version')
          module = Path('malbolge/__init__.py').read_text(encoding='utf8')
          match = re.search(r'^__version__\s*=\s*[\'\"]([^\'\"]+)', module, re.M)
          if not match or match[1] != version:
              raise SystemExit('Project and module versions differ')
          if os.environ.get('GITHUB_REF_TYPE') == 'tag' and os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Tag must equal v plus the exact package version')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf8') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Build, repair and test installed wheels
        if: ${{ !inputs.macos_arm64_only || (matrix.platform == 'macos' && matrix.arch == 'arm64') }}
        env:
          # PR: one interpreter per OS (both libc variants on Linux).
          # Dispatch/tag: 3.9-3.13, 35 wheels across the same five jobs.
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp312-*' || 'cp39-* cp310-* cp311-* cp312-* cp313-*' }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: uv
          # Required mode must fail a C build rather than produce a pure wheel.
          # ARM64 is deliberately advertised/tested only on macOS 15+.
          # Intel retains cibuildwheel defaults; no W^X/JIT policy is relaxed.
          CIBW_ENVIRONMENT: >-
            MALBOLGE_NATIVE_BUILD=required
            MALBOLGE_EXPECTED_VERSION="${{ steps.release.outputs.version }}"
            ${{ matrix.platform == 'macos' && matrix.arch == 'arm64' && 'MACOSX_DEPLOYMENT_TARGET=15.0' || '' }}
          CIBW_ENVIRONMENT_PASS_LINUX: GITHUB_SHA GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          # Preserve Linux reports via a dedicated explicit host bind. Avoid
          # depending on /project copy-out or the default full-host mount.
          CIBW_CONTAINER_ENGINE: >-
            docker; disable_host_mount: true;
            create_args: --volume=${{ github.workspace }}/wheel-provenance:/native-provenance
          CIBW_TEST_REQUIRES: uv==0.11.25
          # cibuildwheel installs each repaired wheel and changes to a temp cwd.
          # Select its PATH interpreter, preventing uv from selecting the host.
          CIBW_TEST_COMMAND: >-
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_native_install.py" --require-native
            ${{ matrix.jit }} --forbid-source-root "{project}"
            --report-dir "{project}/wheel-provenance" &&
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_release_install.py" --require-native
            --expected-version "$MALBOLGE_EXPECTED_VERSION"
            --forbid-source-root "{project}"
            --report "{project}/wheel-provenance/release-$CIBUILDWHEEL_BUILD_IDENTIFIER.json"
          CIBW_TEST_COMMAND_WINDOWS: >-
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_native_install.py" --require-native
            ${{ matrix.jit }} --forbid-source-root "{project}"
            --report-dir "{project}/wheel-provenance" &&
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_release_install.py" --require-native
            --expected-version "%MALBOLGE_EXPECTED_VERSION%"
            --forbid-source-root "{project}"
            --report "{project}/wheel-provenance/release-%CIBUILDWHEEL_BUILD_IDENTIFIER%.json"
          # Linux copies /project into each container; changes there are not
          # returned. The explicit bind preserves reports even when a smoke
          # failure prevents cibuildwheel's final /output copy-out step.
          CIBW_TEST_COMMAND_LINUX: >-
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_native_install.py" --require-native
            ${{ matrix.jit }} --forbid-source-root "{project}"
            --report-dir "/native-provenance" &&
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_release_install.py" --require-native
            --expected-version "$MALBOLGE_EXPECTED_VERSION"
            --forbid-source-root "{project}"
            --report "/native-provenance/release-$CIBUILDWHEEL_BUILD_IDENTIFIER.json"
        run: uvx --python 3.12 cibuildwheel==4.3.0 --platform '${{ matrix.platform }}' --output-dir wheelhouse
      - name: Record wheel hashes and tags
        if: ${{ !inputs.macos_arm64_only || (matrix.platform == 'macos' && matrix.arch == 'arm64') }}
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import zipfile
          wheels = []
          for path in sorted(Path('wheelhouse').glob('*.whl')):
              with zipfile.ZipFile(path) as archive:
                  wheel_metadata = next(name for name in archive.namelist() if name.endswith('.dist-info/WHEEL'))
                  metadata = archive.read(wheel_metadata).decode('utf8')
              wheels.append({'file': path.name, 'bytes': path.stat().st_size,
                             'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                             'wheel_metadata': metadata})
          if not wheels:
              raise SystemExit('No native wheel artifacts were built')
          directory = Path('wheel-provenance')
          directory.mkdir(exist_ok=True)
          (directory / 'artifacts.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'cibuildwheel': '4.3.0',
              'host_uv': '0.11.25', 'wheels': wheels}, indent=2) + '\n')
          PY
      - name: Retain wheels
        if: ${{ !inputs.macos_arm64_only || (matrix.platform == 'macos' && matrix.arch == 'arm64') }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: native-wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
      - name: Retain installed smoke provenance (including failures)
        if: ${{ always() && (!inputs.macos_arm64_only || (matrix.platform == 'macos' && matrix.arch == 'arm64')) }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: native-provenance-${{ matrix.runner }}
          path: wheel-provenance/*.json
          if-no-files-found: warn
          retention-days: 14

  python38-compatibility:
    if: ${{ !inputs.macos_arm64_only }}
    # cibuildwheel 4 intentionally excludes EOL Python 3.8. This separate
    # source build checks the declared floor; its linux wheel is NOT manylinux.
    name: CPython 3.8 source-wheel compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: '3.8'
      - name: Stamp temporary TestPyPI version consistently across jobs
        if: inputs.testpypi
        run: uv run --no-project --python 3.12 python scripts/prepare_testpypi_version.py
      - name: Read the candidate version from source metadata
        id: release
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf8'))['project']['version']
          if not isinstance(version, str) or not re.fullmatch(r'[0-9][A-Za-z0-9.!+_-]*', version):
              raise SystemExit('Invalid source release version')
          module = Path('malbolge/__init__.py').read_text(encoding='utf8')
          match = re.search(r'^__version__\s*=\s*[\'\"]([^\'\"]+)', module, re.M)
          if not match or match[1] != version:
              raise SystemExit('Project and module versions differ')
          if os.environ.get('GITHUB_REF_TYPE') == 'tag' and os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Tag must equal v plus the exact package version')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf8') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Verify build-policy failures and fallback contracts
        run: >-
          uv run --no-project --python 3.8 --with pytest --with hatchling
          --with setuptools pytest test/test_native_packaging.py -q
      - name: Build the Python 3.8 native wheel
        env:
          MALBOLGE_NATIVE_BUILD: required
        run: uv build --python 3.8 --wheel --out-dir wheelhouse-compat
      - name: Install only the built artifact into a fresh environment
        run: |
          uv venv --python 3.8 "$RUNNER_TEMP/native-wheel38"
          uv pip install --python "$RUNNER_TEMP/native-wheel38/bin/python" --no-deps wheelhouse-compat/*.whl
      - name: Verify installed artifact outside the source tree
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --no-project --no-python-downloads
          --python "$RUNNER_TEMP/native-wheel38/bin/python" python
          "$GITHUB_WORKSPACE/scripts/verify_native_install.py"
          --require-native --expect-no-jit --forbid-source-root "$GITHUB_WORKSPACE"
          --report "$GITHUB_WORKSPACE/wheel-provenance/cp38-linux-compatibility.json"
      - name: Verify the installed Python 3.8 release behavior
        working-directory: ${{ runner.temp }}
        env:
          MALBOLGE_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          uv run --no-project --no-python-downloads
          --python "$RUNNER_TEMP/native-wheel38/bin/python" python
          "$GITHUB_WORKSPACE/scripts/verify_release_install.py"
          --require-native --expected-version "$MALBOLGE_EXPECTED_VERSION"
          --forbid-source-root "$GITHUB_WORKSPACE"
          --report "$GITHUB_WORKSPACE/wheel-provenance/release-cp38-linux-compatibility.json"
      - name: Build and install a deliberately pure fallback wheel
        env:
          MALBOLGE_NATIVE_BUILD: disabled
        run: |
          uv build --python 3.8 --wheel --out-dir wheelhouse-pure
          uv venv --python 3.8 "$RUNNER_TEMP/pure-wheel38"
          uv pip install --python "$RUNNER_TEMP/pure-wheel38/bin/python" --no-deps wheelhouse-pure/*.whl
      - name: Verify installed pure fallback outside the source tree
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --no-project --no-python-downloads
          --python "$RUNNER_TEMP/pure-wheel38/bin/python" python
          "$GITHUB_WORKSPACE/scripts/verify_native_install.py"
          --require-pure --expect-no-jit --forbid-source-root "$GITHUB_WORKSPACE"
          --report "$GITHUB_WORKSPACE/wheel-provenance/cp38-pure-fallback.json"
      - name: Verify the installed Python 3.8 pure release behavior
        working-directory: ${{ runner.temp }}
        env:
          MALBOLGE_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          uv run --no-project --no-python-downloads
          --python "$RUNNER_TEMP/pure-wheel38/bin/python" python
          "$GITHUB_WORKSPACE/scripts/verify_release_install.py"
          --require-pure --expected-version "$MALBOLGE_EXPECTED_VERSION"
          --forbid-source-root "$GITHUB_WORKSPACE"
          --report "$GITHUB_WORKSPACE/wheel-provenance/release-cp38-pure-fallback.json"
      - name: Retain compatibility artifact and provenance
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: cp38-linux-compatibility-not-manylinux
          path: |
            wheelhouse-compat/*.whl
            wheel-provenance/*.json
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Validate matrix and retain exact review bundle
    needs: [wheels, python38-compatibility]
    if: ${{ !cancelled() && needs.wheels.result == 'success' && (needs.python38-compatibility.result == 'success' || inputs.macos_arm64_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: '3.12'
      - name: Stamp the same temporary TestPyPI version
        if: inputs.testpypi
        run: uv run --no-project --python 3.12 python scripts/prepare_testpypi_version.py
      - name: Read version and select acceptance scope
        id: release
        env:
          MATRIX_MODE: ${{ inputs.macos_arm64_only && 'macos-arm64-only' || github.event_name == 'pull_request' && 'smoke' || 'full' }}
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          module = Path('malbolge/__init__.py').read_text()
          assert re.search(r'^__version__\s*=\s*[\'\"]' + re.escape(version) + r'[\'\"]', module, re.M)
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag/version mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\nmode=' + os.environ['MATRIX_MODE'] + '\n')
          PY
      - uses: actions/download-artifact@v6.0.0
        with:
          pattern: native-*
          path: native-inputs
          merge-multiple: false
      - name: Validate coverage, installed hashes, tags, licenses and macOS binary floors
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MODE: ${{ steps.release.outputs.mode }}
        run: >-
          uv run --no-project --python 3.12 python scripts/verify_release_artifacts.py
          --artifacts-dir native-inputs --expected-version "$VERSION"
          --expected-commit "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID"
          --expected-attempt "$GITHUB_RUN_ATTEMPT" --mode "$MODE"
          --report release-bundle/native-report.json
      - name: Build portable wheel and sdist from the identical checkout
        if: steps.release.outputs.mode == 'full'
        env:
          MALBOLGE_NATIVE_BUILD: disabled
        run: |
          mkdir -p release-bundle/dist
          uv build --python 3.12 --out-dir portable-build
          cp portable-build/*.whl portable-build/*.tar.gz release-bundle/dist/
          find native-inputs -type f -name '*.whl' -exec cp '{}' release-bundle/dist/ \;
          uvx --python 3.12 twine==7.0.0 check release-bundle/dist/*
      - name: Accept the exact portable and source artifacts in isolated environments
        if: steps.release.outputs.mode == 'full'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MALBOLGE_NATIVE_BUILD: required
        run: |
          uv venv --python 3.8 "$RUNNER_TEMP/bundle-pure"
          uv pip install --python "$RUNNER_TEMP/bundle-pure/bin/python" --no-deps release-bundle/dist/*-py3-none-any.whl
          uv venv --python 3.12 "$RUNNER_TEMP/bundle-sdist"
          uv pip install --python "$RUNNER_TEMP/bundle-sdist/bin/python" --no-deps release-bundle/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          for mode in pure sdist; do
            if [ "$mode" = pure ]; then contract=pure; else contract=native; fi
            uv run --no-project --no-python-downloads --python "$RUNNER_TEMP/bundle-$mode/bin/python" python \
              "$GITHUB_WORKSPACE/scripts/verify_release_install.py" --require-$contract \
              --expected-version "$VERSION" --forbid-source-root "$GITHUB_WORKSPACE" \
              --report "$GITHUB_WORKSPACE/release-bundle/$mode-acceptance.json"
          done
      - name: Seal full bundle and retained verification helpers
        id: bundle
        if: steps.release.outputs.mode == 'full'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv run --no-project --python 3.12 python scripts/verify_release_bundle.py --create \
            --bundle-dir release-bundle --expected-version "$VERSION" --expected-commit "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" --expected-attempt "$GITHUB_RUN_ATTEMPT"
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          root = Path('release-bundle')
          manifest = json.loads((root / 'release-manifest.json').read_text())
          helper = root / 'verification-helper'
          helper.mkdir()
          hashes = {}
          for name in ('verify_native_install.py', 'verify_release_install.py'):
              shutil.copyfile(Path('scripts') / name, helper / name)
              hashes[name] = hashlib.sha256((helper / name).read_bytes()).hexdigest()
          shutil.copyfile('scripts/osp_experiments.py', helper / 'osp_experiments.py')
          shutil.copytree('benchmarks/osp', helper / 'benchmarks' / 'osp',
                          ignore=shutil.ignore_patterns('__pycache__', '*.pyc'))
          shutil.copytree('benchmarks/programs', helper / 'benchmarks' / 'programs',
                          ignore=shutil.ignore_patterns('__pycache__', '*.pyc'))
          for path in sorted(helper.rglob('*')):
              if path.is_file():
                  hashes[path.relative_to(helper).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          provenance = {'commit': manifest['source_commit'], 'run_id': manifest['workflow_run'],
                        'run_attempt': manifest['workflow_attempt'], 'version': manifest['version'],
                        'artifacts': manifest['artifacts'], 'helpers': hashes}
          (helper / 'provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          (helper / 'requirements.txt').write_text('malbolge==' + manifest['version'] + ' ' +
              ' '.join('--hash=sha256:' + a['sha256'] for a in manifest['artifacts']) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('artifact_name=release-bundle-' + manifest['version'] + '-' + manifest['source_commit'] + '\n')
          PY
      - name: Retain the complete review bundle (never uploads to a package index)
        if: steps.release.outputs.mode == 'full'
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Retain matrix acceptance report, including failures and partial runs
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: matrix-acceptance-${{ github.run_attempt }}
          path: release-bundle/native-report.json
          if-no-files-found: warn
          retention-days: 14
