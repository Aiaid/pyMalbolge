name: Native wheel artifacts

on:
  pull_request:
    paths:
      - 'malbolge/**'
      - 'scripts/native_build.py'
      - 'scripts/hatch_native.py'
      - 'scripts/build_native_vm.py'
      - 'scripts/verify_native_install.py'
      - 'scripts/verify_release_install.py'
      - 'test/test_native_packaging.py'
      - 'pyproject.toml'
      - '.github/workflows/native-wheels.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

# Build and retain reviewable artifacts; this workflow never publishes to PyPI.
permissions:
  contents: read

concurrency:
  group: native-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # Five native runners: no QEMU or untested cross-compiled artifacts.
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            jit: --expect-no-jit
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            jit: --require-jit
          - runner: macos-15
            platform: macos
            arch: arm64
            # Hosted macOS can lack thread-local JIT write protection. The
            # helper checks the OS probe and explicit unavailable rejection;
            # if available, real machine-code execution is still mandatory.
            jit: ''
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            jit: --expect-no-jit
          - runner: windows-2022
            platform: windows
            arch: AMD64
            jit: --expect-no-jit
    steps:
      # Versions verified against the official Actions release pages.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: '3.12'
      - name: Prepare persistent smoke reports
        run: mkdir -p wheel-provenance
      - name: Read the candidate version from source metadata
        id: release
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf8'))['project']['version']
          if not isinstance(version, str) or not re.fullmatch(r'[0-9][A-Za-z0-9.!+_-]*', version):
              raise SystemExit('Invalid source release version')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf8') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Build, repair and test installed wheels
        env:
          # PR: one interpreter per OS (both libc variants on Linux).
          # Dispatch/tag: 3.9-3.13, 35 wheels across the same five jobs.
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp312-*' || 'cp39-* cp310-* cp311-* cp312-* cp313-*' }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: uv
          # Required mode must fail a C build rather than produce a pure wheel.
          CIBW_ENVIRONMENT: >-
            MALBOLGE_NATIVE_BUILD=required
            MALBOLGE_EXPECTED_VERSION="${{ steps.release.outputs.version }}"
          CIBW_ENVIRONMENT_PASS_LINUX: GITHUB_SHA GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          # Preserve Linux reports via a dedicated explicit host bind. Avoid
          # depending on /project copy-out or the default full-host mount.
          CIBW_CONTAINER_ENGINE: >-
            docker; disable_host_mount: true;
            create_args: --volume=${{ github.workspace }}/wheel-provenance:/native-provenance
          CIBW_TEST_REQUIRES: uv==0.11.25
          # cibuildwheel installs each repaired wheel and changes to a temp cwd.
          # Select its PATH interpreter, preventing uv from selecting the host.
          CIBW_TEST_COMMAND: >-
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_native_install.py" --require-native
            ${{ matrix.jit }} --forbid-source-root "{project}"
            --report-dir "{project}/wheel-provenance" &&
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_release_install.py" --require-native
            --expected-version "$MALBOLGE_EXPECTED_VERSION"
            --forbid-source-root "{project}"
            --report "{project}/wheel-provenance/release-$CIBUILDWHEEL_BUILD_IDENTIFIER.json"
          CIBW_TEST_COMMAND_WINDOWS: >-
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_native_install.py" --require-native
            ${{ matrix.jit }} --forbid-source-root "{project}"
            --report-dir "{project}/wheel-provenance" &&
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_release_install.py" --require-native
            --expected-version "%MALBOLGE_EXPECTED_VERSION%"
            --forbid-source-root "{project}"
            --report "{project}/wheel-provenance/release-%CIBUILDWHEEL_BUILD_IDENTIFIER%.json"
          # Linux copies /project into each container; changes there are not
          # returned. The explicit bind preserves reports even when a smoke
          # failure prevents cibuildwheel's final /output copy-out step.
          CIBW_TEST_COMMAND_LINUX: >-
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_native_install.py" --require-native
            ${{ matrix.jit }} --forbid-source-root "{project}"
            --report-dir "/native-provenance" &&
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_release_install.py" --require-native
            --expected-version "$MALBOLGE_EXPECTED_VERSION"
            --forbid-source-root "{project}"
            --report "/native-provenance/release-$CIBUILDWHEEL_BUILD_IDENTIFIER.json"
        run: uvx --python 3.12 cibuildwheel==4.3.0 --platform '${{ matrix.platform }}' --output-dir wheelhouse
      - name: Record wheel hashes and tags
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import zipfile
          wheels = []
          for path in sorted(Path('wheelhouse').glob('*.whl')):
              with zipfile.ZipFile(path) as archive:
                  wheel_metadata = next(name for name in archive.namelist() if name.endswith('.dist-info/WHEEL'))
                  metadata = archive.read(wheel_metadata).decode('utf8')
              wheels.append({'file': path.name, 'bytes': path.stat().st_size,
                             'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                             'wheel_metadata': metadata})
          if not wheels:
              raise SystemExit('No native wheel artifacts were built')
          directory = Path('wheel-provenance')
          directory.mkdir(exist_ok=True)
          (directory / 'artifacts.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'cibuildwheel': '4.3.0',
              'host_uv': '0.11.25', 'wheels': wheels}, indent=2) + '\n')
          PY
      - name: Retain wheels
        uses: actions/upload-artifact@v6.0.0
        with:
          name: native-wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
      - name: Retain installed smoke provenance (including failures)
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: native-provenance-${{ matrix.runner }}
          path: wheel-provenance/*.json
          if-no-files-found: warn
          retention-days: 14

  python38-compatibility:
    # cibuildwheel 4 intentionally excludes EOL Python 3.8. This separate
    # source build checks the declared floor; its linux wheel is NOT manylinux.
    name: CPython 3.8 source-wheel compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: '3.8'
      - name: Read the candidate version from source metadata
        id: release
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf8'))['project']['version']
          if not isinstance(version, str) or not re.fullmatch(r'[0-9][A-Za-z0-9.!+_-]*', version):
              raise SystemExit('Invalid source release version')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf8') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Verify build-policy failures and fallback contracts
        run: >-
          uv run --no-project --python 3.8 --with pytest --with hatchling
          --with setuptools pytest test/test_native_packaging.py -q
      - name: Build the Python 3.8 native wheel
        env:
          MALBOLGE_NATIVE_BUILD: required
        run: uv build --python 3.8 --wheel --out-dir wheelhouse-compat
      - name: Install only the built artifact into a fresh environment
        run: |
          uv venv --python 3.8 "$RUNNER_TEMP/native-wheel38"
          uv pip install --python "$RUNNER_TEMP/native-wheel38/bin/python" --no-deps wheelhouse-compat/*.whl
      - name: Verify installed artifact outside the source tree
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --no-project --no-python-downloads
          --python "$RUNNER_TEMP/native-wheel38/bin/python" python
          "$GITHUB_WORKSPACE/scripts/verify_native_install.py"
          --require-native --expect-no-jit --forbid-source-root "$GITHUB_WORKSPACE"
          --report "$GITHUB_WORKSPACE/wheel-provenance/cp38-linux-compatibility.json"
      - name: Verify the installed Python 3.8 release behavior
        working-directory: ${{ runner.temp }}
        env:
          MALBOLGE_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          uv run --no-project --no-python-downloads
          --python "$RUNNER_TEMP/native-wheel38/bin/python" python
          "$GITHUB_WORKSPACE/scripts/verify_release_install.py"
          --require-native --expected-version "$MALBOLGE_EXPECTED_VERSION"
          --forbid-source-root "$GITHUB_WORKSPACE"
          --report "$GITHUB_WORKSPACE/wheel-provenance/release-cp38-linux-compatibility.json"
      - name: Build and install a deliberately pure fallback wheel
        env:
          MALBOLGE_NATIVE_BUILD: disabled
        run: |
          uv build --python 3.8 --wheel --out-dir wheelhouse-pure
          uv venv --python 3.8 "$RUNNER_TEMP/pure-wheel38"
          uv pip install --python "$RUNNER_TEMP/pure-wheel38/bin/python" --no-deps wheelhouse-pure/*.whl
      - name: Verify installed pure fallback outside the source tree
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --no-project --no-python-downloads
          --python "$RUNNER_TEMP/pure-wheel38/bin/python" python
          "$GITHUB_WORKSPACE/scripts/verify_native_install.py"
          --require-pure --expect-no-jit --forbid-source-root "$GITHUB_WORKSPACE"
          --report "$GITHUB_WORKSPACE/wheel-provenance/cp38-pure-fallback.json"
      - name: Verify the installed Python 3.8 pure release behavior
        working-directory: ${{ runner.temp }}
        env:
          MALBOLGE_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          uv run --no-project --no-python-downloads
          --python "$RUNNER_TEMP/pure-wheel38/bin/python" python
          "$GITHUB_WORKSPACE/scripts/verify_release_install.py"
          --require-pure --expected-version "$MALBOLGE_EXPECTED_VERSION"
          --forbid-source-root "$GITHUB_WORKSPACE"
          --report "$GITHUB_WORKSPACE/wheel-provenance/release-cp38-pure-fallback.json"
      - name: Retain compatibility artifact and provenance
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: cp38-linux-compatibility-not-manylinux
          path: |
            wheelhouse-compat/*.whl
            wheel-provenance/*.json
          if-no-files-found: warn
          retention-days: 14
