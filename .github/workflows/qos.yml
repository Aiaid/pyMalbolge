name: Python semantics and runtime quality

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: qos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portability:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: '3.12'
      - run: uv sync --extra dev --extra ir
      - name: Provision hash-pinned reference source and license
        run: uv run --no-sync python scripts/verify_mb_reference.py fetch
      # POSIX wait4 and native/JIT execution remain separate acceptance scopes.
      - name: Check Windows bytes, paths, permissions and platform guards
        run: >-
          uv run --no-sync pytest test/test_benchmark_corpus.py
          test/test_benchmark_fixed_vm.py test/test_benchmark_timing.py
          test/test_cli_qos.py test/test_examples_manifest.py
          test/test_mb_reference_gate.py test/test_native_packaging.py
          test/test_semantic_benchmark.py test/test_testpypi_version.py -q -rs
      - name: Build the Windows native VM
        run: uv run --no-sync --with setuptools --with wheel python scripts/build_native_vm.py
      - name: Require native availability and expected JIT rejection
        run: >-
          uv run --no-sync python -c
          "from malbolge import native; assert native.native_available(); assert not native.jit_available()"
      - name: Verify native VM parity and unavailable-JIT contracts
        run: >-
          uv run --no-sync pytest test/test_native_vm.py test/test_native_jit.py -q -rs
      - name: Verify source distribution and installed native/pure wheels
        env:
          MALBOLGE_PACKAGING_TESTS: '1'
        run: >-
          uv run --no-sync --with hatchling --with setuptools --with wheel python -m pytest
          test/test_native_packaging.py::test_sdist_rebuild_and_installed_wheel_contract -q -rs

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Official setup-uv v10.1.0, pinned to its documented commit.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - name: Provision the pinned independent C reference and license
        run: |
          PATH=/usr/bin:/bin:/usr/sbin:/sbin command -v clang
          uv run --no-sync python scripts/verify_mb_reference.py fetch
      - run: uv run --no-sync pytest test/ -q -n 2

  semantic-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Execute both compiler backends on the project VM
        env:
          MALBOLGE_QOS_E2E: '1'
        run: uv run --no-sync pytest test/test_qos_ci.py -q

  ir-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --extra ir
      - name: Verify IR round trips, pass contracts and determinism canaries
        run: >-
          uv run --no-sync pytest test/test_lal_ir.py test/test_ir_pipeline.py
          test/test_ir_cli.py test/test_semantic_ir.py test/test_semantic_frontend.py
          test/test_semantic_lowering.py test/test_semantic_pipeline.py
          test/test_semantic_cli.py test/test_source_analysis.py -q
