name: TestPyPI release acceptance

on:
  workflow_dispatch:
  push:
    branches: ['codex/testpypi-native-ci']

# This workflow publishes only to the separate test site.
permissions:
  contents: read

concurrency:
  group: testpypi-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build native, portable and source distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: '3.12'
          enable-cache: false
      - name: Stamp matching temporary distribution and module versions
        id: version
        run: uv run --no-project --python 3.12 python scripts/prepare_testpypi_version.py
      - run: mkdir -p wheel-provenance verification-helper
      - name: Build, repair and test the Linux native wheel
        env:
          CIBW_BUILD_FRONTEND: uv
          CIBW_ENVIRONMENT: MALBOLGE_NATIVE_BUILD=required
          CIBW_ENVIRONMENT_PASS_LINUX: GITHUB_SHA GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          CIBW_CONTAINER_ENGINE: >-
            docker; disable_host_mount: true;
            create_args: --volume=${{ github.workspace }}/wheel-provenance:/native-provenance
          CIBW_TEST_REQUIRES: uv==0.11.25
          CIBW_TEST_COMMAND: >-
            uv run --no-project --no-python-downloads --python python python
            "{project}/scripts/verify_native_install.py" --require-native
            --expect-no-jit --forbid-source-root "{project}"
            --report-dir "/native-provenance"
        run: >-
          uvx --python 3.12 cibuildwheel==4.3.0
          --only cp312-manylinux_x86_64 --output-dir wheelhouse
      - name: Build portable wheel and source archive
        env:
          MALBOLGE_NATIVE_BUILD: disabled
        run: uv build --python 3.12 --out-dir wheelhouse
      - name: Check distribution metadata
        run: uvx --python 3.12 twine==7.0.0 check wheelhouse/*
      - name: Record artifact and verification-helper identity
        env:
          TEST_PYPI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib, json, os, shutil, tarfile, zipfile
          from email.parser import BytesParser
          from pathlib import Path
          version = os.environ['TEST_PYPI_VERSION']
          paths = sorted(list(Path('wheelhouse').glob('*.whl')) +
                         list(Path('wheelhouse').glob('*.tar.gz')))
          assert len(paths) == 3, 'Expected one native wheel, one pure wheel and one sdist'
          artifacts = []
          for path in paths:
              if path.suffix == '.whl':
                  with zipfile.ZipFile(path) as archive:
                      name = next(n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))
                      data = archive.read(name)
              else:
                  with tarfile.open(path) as archive:
                      name = next(n for n in archive.getnames() if n.endswith('/PKG-INFO'))
                      data = archive.extractfile(name).read()
              metadata = BytesParser().parsebytes(data)
              assert metadata['Name'] == 'malbolge' and metadata['Version'] == version
              artifacts.append({'file':path.name, 'bytes':path.stat().st_size,
                                'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          assert sum(a['file'].endswith('-py3-none-any.whl') for a in artifacts) == 1
          assert sum(a['file'].endswith('.tar.gz') for a in artifacts) == 1
          helpers = {}
          for name in ('verify_native_install.py', 'verify_release_install.py'):
              target = Path('verification-helper') / name
              shutil.copyfile(Path('scripts') / name, target)
              helpers[name] = hashlib.sha256(target.read_bytes()).hexdigest()
          provenance = {'commit':os.environ['GITHUB_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'],
                        'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'], 'version':version,
                        'artifacts':artifacts, 'helpers':helpers}
          text = json.dumps(provenance, indent=2, sort_keys=True) + '\n'
          Path('verification-helper/provenance.json').write_text(text)
          Path('wheel-provenance/artifacts.json').write_text(text)
          hashes = ' '.join('--hash=sha256:' + a['sha256'] for a in artifacts)
          Path('verification-helper/requirements.txt').write_text('malbolge==' + version + ' ' + hashes + '\n')
          print(text)
          PY
      - name: Retain test-site distributions
        uses: actions/upload-artifact@v6.0.0
        with:
          name: testpypi-distributions-${{ steps.version.outputs.version }}
          path: wheelhouse/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain pinned verification helpers
        uses: actions/upload-artifact@v6.0.0
        with:
          name: testpypi-verification-helper-${{ steps.version.outputs.version }}
          path: verification-helper/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain build provenance
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: testpypi-build-provenance-${{ github.run_attempt }}
          path: wheel-provenance/*.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish the three distributions to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Only the upload action receives the existing test-site token.
      - uses: actions/download-artifact@v6.0.0
        with:
          name: testpypi-distributions-${{ needs.build.outputs.version }}
          path: dist
      - name: Require the configured TestPyPI credential
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -z "$TEST_PYPI_API_TOKEN" ]; then
            echo '::error::TEST_PYPI_API_TOKEN is not configured; no upload was attempted'
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: false
          verbose: false

  verify-testpypi:
    name: Remote install (${{ matrix.label }})
    needs: [build, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: linux-py38-pure, runner: ubuntu-24.04, python: '3.8', mode: pure, ir: false, source: false}
          - {label: linux-py310-ir, runner: ubuntu-24.04, python: '3.10', mode: pure, ir: true, source: false}
          - {label: linux-py312-native, runner: ubuntu-24.04, python: '3.12', mode: native, ir: false, source: false}
          - {label: linux-py313-pure, runner: ubuntu-24.04, python: '3.13', mode: pure, ir: false, source: false}
          - {label: linux-arm64-pure, runner: ubuntu-24.04-arm, python: '3.12', mode: pure, ir: false, source: false}
          - {label: macos-arm64-pure, runner: macos-15, python: '3.12', mode: pure, ir: false, source: false}
          - {label: macos-intel-pure, runner: macos-15-intel, python: '3.12', mode: pure, ir: false, source: false}
          - {label: windows-pure, runner: windows-2022, python: '3.12', mode: pure, ir: false, source: false}
          - {label: linux-source-native, runner: ubuntu-24.04, python: '3.12', mode: native, ir: false, source: true}
    env:
      TEST_PYPI_VERSION: ${{ needs.build.outputs.version }}
      UV_NO_CACHE: 'true'
      UV_HTTP_TIMEOUT: '10'
      UV_HTTP_RETRIES: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v6.0.0
        with:
          name: testpypi-verification-helper-${{ needs.build.outputs.version }}
          path: verification-helper
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.25'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Verify source/helper identity and prepare isolated environment
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --python '${{ matrix.python }}' python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'verification-helper'
          provenance = json.loads((root / 'provenance.json').read_text())
          assert provenance['commit'] == os.environ['GITHUB_SHA']
          assert provenance['run_id'] == os.environ['GITHUB_RUN_ID']
          assert provenance['version'] == os.environ['TEST_PYPI_VERSION']
          for name, digest in provenance['helpers'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          hashes = ' '.join('--hash=sha256:' + a['sha256'] for a in provenance['artifacts'])
          assert (root / 'requirements.txt').read_text() == 'malbolge==' + provenance['version'] + ' ' + hashes + '\n'
          PY
          uv venv --python '${{ matrix.python }}' "$RUNNER_TEMP/testpypi-install"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "INSTALL_PYTHON=$RUNNER_TEMP/testpypi-install/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "INSTALL_PYTHON=$RUNNER_TEMP/testpypi-install/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Install source-build dependencies from production PyPI
        if: matrix.source
        run: uv pip install --python "$INSTALL_PYTHON" --index-url https://pypi.org/simple/ hatchling setuptools wheel
      - name: Download and install exact hashed distribution from TestPyPI
        working-directory: ${{ runner.temp }}
        env:
          TEST_SOURCE: ${{ matrix.source }}
          MALBOLGE_NATIVE_BUILD: required
        run: |
          uv run --no-project --python '${{ matrix.python }}' python - <<'PY'
          import os, subprocess, time
          from pathlib import Path
          requirement = Path(os.environ['GITHUB_WORKSPACE']) / 'verification-helper/requirements.txt'
          command = ['uv', 'pip', 'install', '--python', os.environ['INSTALL_PYTHON'],
                     '--index-url', 'https://test.pypi.org/simple/', '--no-deps',
                     '--require-hashes', '-r', str(requirement)]
          source = os.environ['TEST_SOURCE'] == 'true'
          command += (['--no-binary', 'malbolge', '--no-build-isolation'] if source
                      else ['--only-binary', ':all:'])
          for attempt in range(4):
              try:
                  result = subprocess.run(command, timeout=150 if source else 20)
                  if result.returncode == 0:
                      break
              except subprocess.TimeoutExpired:
                  pass
              if attempt == 3:
                  raise SystemExit('Exact TestPyPI artifact did not install within retry budget')
              time.sleep(2 * (attempt + 1))
          PY
      - name: Install pinned optional IR dependencies from production PyPI
        if: matrix.ir
        run: uv pip install --python "$INSTALL_PYTHON" --index-url https://pypi.org/simple/ xdsl==0.69.0
      - name: Verify installed compiler, runtime and exact package identity
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --no-project --no-python-downloads --python "$INSTALL_PYTHON" python
          "$GITHUB_WORKSPACE/verification-helper/verify_release_install.py"
          --expected-version "$TEST_PYPI_VERSION" --require-${{ matrix.mode }}
          ${{ matrix.ir && '--require-ir' || '' }}
          --forbid-source-root "$GITHUB_WORKSPACE"
          --report "$GITHUB_WORKSPACE/testpypi-install-provenance/release.json"
      - name: Verify VM memory, byte I/O and native contracts
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --no-project --no-python-downloads --python "$INSTALL_PYTHON" python
          "$GITHUB_WORKSPACE/verification-helper/verify_native_install.py"
          --require-${{ matrix.mode }} --expect-no-jit
          --forbid-source-root "$GITHUB_WORKSPACE"
          --report "$GITHUB_WORKSPACE/testpypi-install-provenance/vm.json"
      - name: Retain remote installation provenance
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: testpypi-install-${{ matrix.label }}-${{ github.run_attempt }}
          path: testpypi-install-provenance/*.json
          if-no-files-found: warn
          retention-days: 14
