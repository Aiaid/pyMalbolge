name: Check production credential availability
on:
  push:
    branches: ['codex/check-pypi-release-credential']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report availability only; never reveal credential contents
        env:
          PRODUCTION_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TEST_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -n "$PRODUCTION_TOKEN" ]; then
            echo 'PYPI_API_TOKEN_AVAILABLE=true'
          else
            echo 'PYPI_API_TOKEN_AVAILABLE=false'
          fi
          if [ -n "$TEST_TOKEN" ]; then
            echo 'TEST_PYPI_API_TOKEN_AVAILABLE=true'
          else
            echo 'TEST_PYPI_API_TOKEN_AVAILABLE=false'
          fi
