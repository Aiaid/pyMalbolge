[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "malbolge"
version = "1.0.0"
authors = [
  { name="Anend", email="anend@live.com" },
]
description = "Malbolge / Malbolge20 interpreter, debugger and pure-Python Python-to-Malbolge20 compiler"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["malbolge", "malbolge20", "esolang", "interpreter", "compiler", "debugger"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Debuggers",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.40.0"]
dev = ["pytest", "pytest-xdist", "textual>=0.40.0"]

[project.scripts]
malbolge = "malbolge.malbolge:main"
malbolge-debug = "malbolge.debug_cli:main"
malbolge-tui = "malbolge.debug_tui:main"

[project.urls]
Homepage = "https://github.com/Aiaid/pyMalbolge"
Issues = "https://github.com/Aiaid/pyMalbolge/issues"

# Explicit allowlist. Hatchling's default is "everything not VCS-ignored",
# which swept a local virtualenv, scratch files and .claude/ into the sdist.
# Anything not listed here never reaches PyPI.
[tool.hatch.build.targets.sdist]
include = [
    "/malbolge",
    "/test",
    "/examples",
    "/runtime",
    "/scripts",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/docs/research",
]

[tool.hatch.build.targets.wheel]
packages = ["malbolge"]
